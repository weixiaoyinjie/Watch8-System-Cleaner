name: Build Watch8 Manager V2.2 CryptoFix APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2.2 CryptoFix ZIP (required)
        shell: bash
        run: |
          set -euo pipefail
          archive=Watch8_System_Manager_V2_2_CryptoFix_OneUpload.zip
          test -f "$archive" || { echo "ERROR: Upload $archive to repository root first"; exit 1; }
          unzip -oq "$archive" -d .
          grep -Fq "versionName '2.2.0'" app/build.gradle
          grep -Fq "bcutil-jdk15to18:1.78.1" app/build.gradle
          test -f tools/verify_apk_crypto.py
          test -f app/src/main/java/com/watch8/cleaner/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android@v3 here: it attempts the
      # obsolete SDK package named "tools" and fails with exit code 1.
      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK directory: ${ANDROID_HOME:-not set}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || \
                ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build phone debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify ADB crypto classes and native libraries packaged
        run: python3 tools/verify_apk_crypto.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Manager-V2.2-CryptoFix-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
