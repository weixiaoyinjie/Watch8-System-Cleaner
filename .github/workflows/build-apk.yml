name: Build Watch8 Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract OneUpload ZIP when source is zipped
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f settings.gradle || ! -f app/build.gradle ]]; then
            if [[ -f Watch8_System_Manager_V2_OneUpload.zip ]]; then
              archive=Watch8_System_Manager_V2_OneUpload.zip
            elif [[ -f Watch8_System_Cleaner_V1_OneUpload.zip ]]; then
              archive=Watch8_System_Cleaner_V1_OneUpload.zip
            else
              echo 'ERROR: Upload Watch8_System_Manager_V2_OneUpload.zip to the repository root.'
              exit 1
            fi
            echo "Extracting $archive"
            unzip -o -q "$archive" -d .
          fi
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/watch8/cleaner/MainActivity.java
          ls -l settings.gradle build.gradle app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build phone debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Manager-v2-phone-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
