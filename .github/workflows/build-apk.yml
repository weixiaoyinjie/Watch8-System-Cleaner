name: Build Watch8 Manager V2.4 CryptoDeps APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2.4 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive=Watch8_System_Manager_V2_4_CryptoDeps_OneUpload.zip
          test -f "$archive" || { echo "ERROR: Upload $archive to repository root first"; exit 1; }
          unzip -oq "$archive" -d .
          grep -Fq "versionName '2.4.0'" app/build.gradle
          for module in bcprov bcpkix bcutil; do
            grep -Fq "${module}-jdk18on:1.81" app/build.gradle
          done
          test -f tools/verify_apk_crypto.py
          test -f app/src/main/java/com/watch8/cleaner/AdbIdentity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || \
                ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check resolved ADB encryption dependencies
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /tmp/watch8-deps.txt
          grep -E 'bouncycastle:|libadb-android' /tmp/watch8-deps.txt || true
          if grep -E 'org\.bouncycastle:.*FAILED' /tmp/watch8-deps.txt; then
            echo 'ERROR: Bouncy Castle dependency could not be resolved'; exit 1
          fi
          for module in bcprov bcpkix bcutil; do
            grep -Fq "org.bouncycastle:${module}-jdk18on:1.81" /tmp/watch8-deps.txt || {
              echo "ERROR: Required ${module}-jdk18on:1.81 missing"; exit 1;
            }
          done
          if grep -E 'org\.bouncycastle:.*-jdk15to18:' /tmp/watch8-deps.txt; then
            echo 'ERROR: conflicting Bouncy Castle jdk15to18 artifact detected'; exit 1
          fi

      - name: Clean build phone APK
        run: gradle --no-daemon --stacktrace :app:clean :app:assembleDebug

      - name: Verify packaged ADB crypto and arm64 libraries
        run: python3 tools/verify_apk_crypto.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V2.4 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Manager-V2.4-CryptoDeps-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
