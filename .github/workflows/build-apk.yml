name: Build Watch8 Manager PairFix APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Always apply the uploaded bugfix ZIP, even if the repository also
      # contains Gradle source files from an older revision.
      - name: Extract latest OneUpload source
        shell: bash
        run: |
          set -euo pipefail
          archive=Watch8_System_Manager_V2_1_PairFix_OneUpload.zip
          if [[ -f "$archive" ]]; then
            echo "Applying pair-fix source: $archive"
            unzip -oq "$archive" -d .
          elif [[ -f Watch8_System_Manager_V2_OneUpload.zip ]]; then
            echo 'Using legacy V2 ZIP (upgrade recommended)'
            unzip -oq Watch8_System_Manager_V2_OneUpload.zip -d .
          elif [[ -f settings.gradle && -f app/build.gradle ]]; then
            echo 'Building existing repository sources'
          else
            echo 'ERROR: Upload the PairFix OneUpload ZIP to the repository root.'
            exit 1
          fi
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/watch8/cleaner/MainActivity.java
          if [[ -f "$archive" ]]; then
            grep -q 'versionName .2.1.1.' app/build.gradle
            grep -q 'CrashDiagnostics' app/src/main/java/com/watch8/cleaner/MainActivity.java
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build phone debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Manager-V2.1.1-PairFix-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
